<style>
/* Layout concept: an app, not an article. One chunky action per screen, a bottom bar for Continue, Halloween palette on black. */
:root{
  --bg:#0D0A12; --surface:#1A1424; --surface2:#261B38; --line:#3A2C52;
  --fg:#FFFFFF; --muted:#BDB0D4; --ink:#0D0A12;
  --orange:#FF7A1A; --orange-d:#B84800;
  --purple:#8B3DFF; --purple-d:#5A1CB5; --purple-soft:#2A1650;
  --green:#39FF14; --green-d:#1C9E00; --green-soft:#0F2A0C;
  --font:"Nunito","Avenir Next","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:700 16px/1.45 var(--font);
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.has-foot{padding-bottom:150px}
.shell{max-width:640px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2rem,8vw,2.7rem);font-weight:900;line-height:1.1;text-wrap:balance}
h2{font-size:clamp(1.3rem,5vw,1.7rem);font-weight:900;line-height:1.2;text-wrap:balance}
h3{font-size:1.05rem;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

.wm{font-weight:900;font-size:1.5rem;letter-spacing:-.01em}
.wm b{color:var(--orange);font-weight:900}
.wm span{color:var(--green)}
.hero{text-align:center;padding-top:18px;display:grid;justify-items:center;gap:10px}
.mascot{width:104px;height:auto}
.hero .sub{color:var(--muted);font-weight:700;font-size:1.05rem;max-width:30ch}
.stack{display:grid;gap:14px;margin-top:26px}
.meta2{text-align:center;color:var(--muted);font-size:.85rem;margin-top:16px}

.btn{display:inline-block;border:0;border-radius:16px;padding:15px 22px;font:900 .95rem/1 var(--font);letter-spacing:.08em;text-transform:uppercase;background:var(--green);color:var(--ink);box-shadow:0 5px 0 var(--green-d);text-align:center}
.btn:active:not([disabled]){transform:translateY(5px);box-shadow:0 0 0 transparent}
.btn.block{display:block;width:100%}
.btn.purple{background:var(--purple);color:#fff;box-shadow:0 5px 0 var(--purple-d)}
.btn.orange{background:var(--orange);color:var(--ink);box-shadow:0 5px 0 var(--orange-d)}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{background:var(--surface2);color:#7F719A;box-shadow:0 5px 0 var(--line);cursor:not-allowed}

.sec{margin-top:40px}
.kick{color:var(--orange);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;margin-bottom:6px}
.samples{display:grid;gap:10px;margin-top:10px}
.sample{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sample b{font-weight:900;font-size:1.05rem}
.sample span{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.dd{margin-top:28px}
.dd summary{cursor:pointer;font-weight:900;list-style:none;display:flex;justify-content:space-between;gap:10px}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"+";color:var(--green);font-size:1.3rem;line-height:1}
.dd[open] summary::after{content:"–"}
.dd h3{margin-top:18px;color:var(--orange)}
.dl{list-style:none;margin:8px 0 0;padding:0}
.dl li{padding:9px 0;border-top:2px solid var(--line)}
.dl .n{font-weight:900;display:block}
.dl .d{font-size:.9rem;color:var(--muted);font-weight:700}
.dl .code{display:block;margin-top:2px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.tree li.cls{display:block;grid-column:1/-1;font-weight:900;color:var(--orange);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;padding:0;border:0}

.vz{margin-top:12px}
.vz>input{position:absolute;opacity:0;pointer-events:none}
.vzt{display:flex;flex-wrap:wrap;gap:8px}
.vzt label{border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:900;font-size:.85rem;color:var(--muted);cursor:pointer;background:var(--surface)}
.vzp{display:none;margin-top:14px}
#vz0:checked~.vzt label[for=vz0],#vz1:checked~.vzt label[for=vz1],#vz2:checked~.vzt label[for=vz2],#vz3:checked~.vzt label[for=vz3],#vz4:checked~.vzt label[for=vz4]{background:var(--purple);border-color:var(--purple);color:#fff}
#vz0:focus-visible~.vzt label[for=vz0],#vz1:focus-visible~.vzt label[for=vz1],#vz2:focus-visible~.vzt label[for=vz2],#vz3:focus-visible~.vzt label[for=vz3],#vz4:focus-visible~.vzt label[for=vz4]{outline:3px solid var(--green);outline-offset:2px}
#vz0:checked~.p0,#vz1:checked~.p1,#vz2:checked~.p2,#vz3:checked~.p3,#vz4:checked~.p4{display:block}

.grid7{display:grid;grid-template-columns:6.8rem repeat(6,1fr);gap:4px;margin-top:12px;align-items:center}
.gh{font-size:.56rem;font-weight:900;color:var(--muted);text-align:center;line-height:1.1;overflow-wrap:anywhere}

.gc.none{color:var(--line);border-style:dashed}
.gc.l0{background:var(--surface2);color:var(--muted)}.gc.l1{background:var(--purple-soft);color:#EADFFF;border-color:var(--purple)}.gc.l2{background:#3A2008;color:var(--orange);border-color:var(--orange)}.gc.l3{background:var(--green);color:#0D0A12;border-color:var(--green)}
.lane li>.st{grid-column:2;grid-row:1;justify-self:end;text-align:right}
.lane li>.pips{grid-column:1/-1;grid-row:2}
.lane ul.nx li{display:block;border-top:2px solid var(--line);padding:8px 0 0;margin-top:8px;font-size:.9rem;font-weight:600;color:var(--muted)}
.lane p.vznote{padding:0 2px}
.fine{margin-top:34px;color:var(--muted);font-size:.8rem;font-weight:600;text-align:center}

.qtop{display:flex;align-items:center;gap:14px;margin-top:4px}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;padding:6px 8px;font-weight:900}
.pbar{flex:1;height:16px;background:var(--surface2);border-radius:10px;overflow:hidden}
.pbar i{display:block;height:100%;min-width:16px;background:var(--green);border-radius:10px;position:relative;transition:width .25s}

.opts{display:grid;gap:12px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px}
.opt:hover{background:var(--surface2)}
.opt.on{border-color:var(--purple);background:var(--purple-soft)}
.opt .lv{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.85rem;color:var(--muted)}
.opt.on .lv{background:var(--purple);border-color:var(--purple);color:#fff}
.opt .txt{display:flex;flex-direction:column;min-width:0}
.opt .ot{font-weight:800}
.opt .od{font-size:.85rem;color:var(--muted);font-weight:600}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot .grp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.link{background:none;border:0;padding:8px 2px;color:var(--muted);font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.link:hover{color:var(--fg)}
.link[disabled]{opacity:.35;cursor:default}
.intro{display:grid;justify-items:center;text-align:center;gap:14px;margin-top:30px}
.intro .rules{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px;width:100%;text-align:left}
.intro .rules li{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:700;color:var(--muted)}

.rtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.res{padding-top:6px}
.tagcard{margin-top:20px;background:var(--purple);border-bottom:6px solid var(--purple-d);border-radius:22px;padding:clamp(20px,5vw,30px)}
.tagcard .lab{font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:#E4D3FF}
.tag{font-weight:900;font-size:clamp(1.9rem,7vw,2.9rem);line-height:1.08;margin-top:10px;text-wrap:balance;overflow-wrap:anywhere}
.tagnote{margin-top:12px;font-weight:700;color:#F1E8FF}
.key{margin-top:12px;display:inline-block;background:rgba(13,10,18,.35);border-radius:10px;padding:4px 10px;font-size:.78rem;font-weight:800;color:#fff}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.tagcard .btn.ghost{background:rgba(13,10,18,.35);border-color:transparent;box-shadow:0 5px 0 rgba(13,10,18,.45);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--orange)}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.sec h2{margin-bottom:4px}
.sec .help{color:var(--muted);font-size:.92rem;font-weight:600}
.spider{width:100%;max-width:560px;height:auto;display:block;margin:10px auto 0}
.spider .ring{fill:none;stroke:var(--line);stroke-width:1.5}
.spider .spoke{stroke:var(--line);stroke-width:1.5}
.spider .area{fill:var(--orange);fill-opacity:.3;stroke:var(--orange);stroke-width:3;stroke-linejoin:round}
.spider .dot{fill:var(--green)}
.spider .lbl{fill:var(--fg);font:800 12px var(--font)}
.spider .val{fill:var(--green);font:900 12px var(--font)}
.spider .rl{fill:var(--muted);font:700 9px var(--font)}
.sbars{display:grid;gap:12px;margin-top:14px}
.sb{display:grid;grid-template-columns:8.6rem 1fr 2.2rem;gap:10px;align-items:center;font-weight:800;font-size:.92rem}
.sb .track{height:14px;background:var(--surface2);border-radius:8px;overflow:hidden}
.sb .track i{display:block;height:100%;background:var(--purple);border-radius:8px}
.sb.top .track i{background:var(--orange)}
.sb .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.diag{margin-top:18px;display:grid;gap:10px;color:var(--muted);font-weight:600;font-size:.95rem}
.diag b{color:var(--fg);font-weight:900}
.tree{margin-top:14px;display:grid;gap:10px}
.lane{background:var(--surface);border:2px solid var(--line);border-radius:16px}
.lane summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-weight:900;list-style:none}
.lane summary::-webkit-details-marker{display:none}
.lane summary .sc{color:var(--orange);font-variant-numeric:tabular-nums}
.lane ul{list-style:none;margin:0;padding:0 16px 12px;display:grid;gap:8px}
.lane li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-top:2px solid var(--line);padding-top:8px;font-size:.92rem;font-weight:700}
.lane li>*{min-width:0}
.lane .st{grid-column:1/-1;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line)}

.map{display:grid;gap:12px;margin-top:14px}
.mcard{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}

.halves{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}

.hl{font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hn{font-size:1.5rem;font-weight:900;margin-top:4px;line-height:1.1;overflow-wrap:anywhere}
.ha .hn{color:var(--orange)}
.hs .hn{color:var(--green)}
.hq{font-weight:900;margin-top:8px}
.hd{color:var(--muted);font-weight:600;font-size:.9rem;margin-top:6px}
.hd b{color:var(--fg);font-weight:900}
.hc{margin-top:10px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.card h3{color:var(--orange);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;font-weight:900}
.card.read,.card.note{margin-top:12px}
.card.read ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:12px}
.card.read li{display:grid;grid-template-columns:3.4rem 1fr;gap:12px;align-items:start;font-weight:600;color:var(--muted);font-size:.93rem}
.card.read li b{color:var(--fg);font-weight:900}
.sym{background:var(--purple-soft);border:2px solid var(--purple);border-radius:12px;text-align:center;font-weight:900;color:#fff;padding:4px 0;font-size:1.05rem}
.card.note{background:var(--purple-soft);border-color:var(--purple)}

.card.dd{margin-top:12px}
.card.src{margin-top:12px}
.fine{color:var(--muted);font-weight:600;font-size:.85rem;margin:12px 0 0}
.btn-link{display:inline-block;margin-top:10px;color:var(--orange);font-weight:900;text-decoration:none}
.card a{color:var(--green);font-weight:800;text-underline-offset:3px}
.posts{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
@media (max-width:520px){.halves{grid-template-columns:1fr}}
.tagdemo{margin-top:14px;background:var(--purple);border-bottom:6px solid var(--purple-d);border-radius:18px;padding:18px;text-align:center;font-weight:900;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.1}

<script>
const AN={web:'Web',net:'Network',cloud:'Cloud',mob:'Mobile',cry:'Cryptocurrency',hum:'Human',iot:'IoT',bin:'Binary',ai:'AI'};
const SN={op:'Operator',tool:'Toolsmith',exp:'Exploit Developer',res:'Researcher',re:'Reverse Engineer',st:'Strategist'};
const AK=Object.keys(AN), SK=Object.keys(SN);

const ADEF={
  web:'Web applications and APIs',
  net:'Networks, Active Directory, protocols and Wi-Fi',
  cloud:'AWS, Azure and GCP: identity, permissions, misconfiguration',
  mob:'iOS and Android apps and their runtime',
  cry:'Smart contracts, DeFi protocols, wallets and bridges',
  hum:'People, process and physical access',
  iot:'Embedded devices, firmware, hardware interfaces and radio',
  bin:'Compiled native code and memory corruption',
  ai:'Machine-learning systems and LLM-based applications'
};
const SDEF={
  op:['Masters existing tools and techniques, then chains what they find','Coding: existing tools do most of the work'],
  tool:['Builds custom offensive tooling: implants, C2, loaders, automation','Coding: writes custom programs'],
  exp:['Turns a known bug into a reliable way in','Coding: writes custom, low-level code'],
  res:['Discovers bugs nobody has reported yet','Coding: reads and writes code to find flaws'],
  re:['Takes software, firmware or protocols apart to learn how they work','Coding: reads code, uses analysis tools'],
  st:['Scouts the target, then plans where to hit and in what order','Coding: little needed']
};
/* Pairing validity per spec section 5. Columns follow SK order: op, tool, exp, res, re, st. Y common, R rare, N invalid. */
const V={web:'YYRYRY',net:'YYYYYY',cloud:'YYNYNY',mob:'YRYYYR',cry:'RRYYRR',hum:'YYNRNY',iot:'YRYYYR',bin:'RYYYYN',ai:'YRRYRR'};
const pairV=(a,s)=>V[a][SK.indexOf(s)];

const LADDER=[
  ['Never','Have not done this'],
  ['Tried it','Followed a tutorial, walkthrough or guided lab'],
  ['Did it on my own','Solved it unaided, such as a lab or CTF with no walkthrough'],
  ['Done it for real','Used outside practice: a paid test, bug bounty, public write-up or released tool']
];
const LEVEL=['Never','Tried','Independent','Real'];

/* Assessment 2 items: [archetype, style, sub-skill, text] */
const CLASSES={web:['Client Side','Server Side','API'],net:['Radio/Wireless','Active Directory','Protocol'],cloud:['IAM/Access','Container/Orchestration','Serverless/Control-Plane'],mob:['iOS','Android','Mobile Web'],cry:['Solidity/EVM','Bridge','Perceptual'],hum:['Phishing/Vishing','OSINT','On Site'],iot:['Firmware','Hardware','Embedded Protocols'],bin:['Memory Corruption','Kernel'],ai:['Adaptive Malware','Compromise']};
const ITEMS=[
  ['web','op','Server-side testing',`Tested a web app's backend for injection or access-control flaws using Burp Suite or a similar proxy.`,'Server Side'],
  ['web','st','API mapping',`Mapped an API's endpoints, parameters and user roles before testing it.`,'API'],
  ['web','tool','Client-side tooling',`Wrote a script or browser extension that automated finding XSS or DOM-based flaws.`,'Client Side'],
  ['web','res','Source review and fuzzing',`Found a bug in a web backend by reading its source code or fuzzing it.`,'Server Side'],
  ['web','exp','API exploit chaining',`Built or modified a working exploit for an API flaw, such as broken authentication or schema abuse.`,'API'],

  ['net','op','Active Directory compromise',`Compromised hosts in an Active Directory environment using tools such as Impacket or Metasploit.`,'Active Directory'],
  ['net','st','Active Directory attack paths',`Used BloodHound or similar to plan an Active Directory attack path.`,'Active Directory'],
  ['net','tool','Tunneling and relay tooling',`Wrote custom tooling for pivoting, tunneling or relaying network traffic.`,'Protocol'],
  ['net','exp','Network service exploits',`Adapted or wrote an exploit for a vulnerable network service or protocol implementation.`,'Protocol'],

/* ---------- scoring ---------- */
const rankKeys=(o,keys)=>keys.slice().sort((x,y)=>(o[y]-o[x])||(keys.indexOf(x)-keys.indexOf(y)));

/* Fair tie-break: a fixed scramble of the scores, so equal scores never favor a lane by list order. Same answers, same tag. */
function jitter(seed){
  let h=2166136261;for(const c of String(seed)){h=Math.imul(h^c.charCodeAt(0),16777619)>>>0}
  return k=>{let x=Math.imul(h^(k.charCodeAt(0)*131+k.charCodeAt(k.length-1)*7+k.length),2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;return (x%1000)/100000};
}
/* Calibration multipliers (set by simulation so that random answers favor no lane or Style). Used only to choose the tag, never shown. */
function scoreA2(ans){
  const aS={},aM={},sS={},sM={},aE={},sE={};
  AK.forEach(k=>{aS[k]=0;aM[k]=0;aE[k]=false});
  SK.forEach(k=>{sS[k]=0;sM[k]=0;sE[k]=false});
  ITEMS.forEach(([a,s],i)=>{
    const p=ans[i]||0;
    aS[a]+=p;aM[a]+=3;sS[s]+=p;sM[s]+=3;
    if(p>=2){aE[a]=true;sE[s]=true}
  });
  const A={},S={};
  AK.forEach(k=>A[k]=aS[k]/aM[k]*100);
  SK.forEach(k=>S[k]=sS[k]/sM[k]*100);
  return {A,S,aE,sE};
}
function pairOK(a,s,ev){
  const v=pairV(a,s);
  if(v==='N')return false;
  if(v==='R'&&ev)return !!(ev.aE[a]&&ev.sE[s]);
  return true;
}
function tagA2(r){
  const J=jitter(AK.map(k=>Math.round(r.A[k]*100)).join(',')+'|'+SK.map(k=>Math.round(r.S[k]*100)).join(','));
  const ra={},rs={};
  AK.forEach(k=>ra[k]=r.A[k]+J(k));SK.forEach(k=>rs[k]=r.S[k]+J(k));
  const ar=rankKeys(ra,AK), sr=rankKeys(rs,SK);
  if(r.A[ar[0]]<20)return {none:true,ar,sr};
  let a=ar[0], s=sr[0], fell=false;
  if(!pairOK(a,s,r)){
    fell=true;
    let best=null;
    AK.forEach(x=>SK.forEach(y=>{
      if(!pairOK(x,y,r))return;
      const sc=ra[x]+rs[y];
      if(!best||sc>best.sc+1e-9)best={x,y,sc};
    }));
    if(best){a=best.x;s=best.y}
  }
  let b=null;
  ar.forEach(x=>{if(b||x===a||r.A[x]<=0)return;if(pairOK(x,s,r))b=x});
  let mode='pure',gap=1;
  if(b){
    gap=Math.abs(r.A[a]-r.A[b])/Math.max(r.A[a],r.A[b]);
    mode=gap<=0.15?'hybrid':(gap<=0.40?'second':'pure');
  }
  let first=a,other=b;
  if(b&&r.A[b]>r.A[a]){first=b;other=a}
  let tag;
  if(mode==='hybrid')tag=`${AN[first]} × ${AN[other]} ${SN[s]}`;
  else if(mode==='second')tag=`${AN[a]} (${AN[b]}) ${SN[s]}`;
  else tag=`${AN[a]} ${SN[s]}`;
  return {a,s,b,mode,gap,tag,fell,ar,sr};
}
function scoreA1(ans){
  const appear={},pick={};
  [...AK,...SK].forEach(k=>{appear[k]=0;pick[k]=0});
  QQ.forEach((q,i)=>{
    q.o.forEach(o=>appear[o[1]]++);
    if(ans[i]!=null)pick[q.o[ans[i]][1]]++;
  });
  const A={},S={};
  AK.forEach(k=>A[k]=appear[k]?pick[k]/appear[k]*100:0);
  SK.forEach(k=>S[k]=appear[k]?pick[k]/appear[k]*100:0);
  return {A,S};
}
function tagA1(r,ans){
  /* Exact ties are broken by a fixed scramble of the answers, so no lane is favored by list order. Same answers, same tag. */
  let h=2166136261;(ans||[]).forEach((v,j)=>{const k=v==null||!QQ[j]?'-':QQ[j].o[v][1];for(const c of k)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0});
  const eps=k=>{let x=Math.imul(h^(k.charCodeAt(0)*131+k.charCodeAt(k.length-1)*7+k.length),2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;return (x%1000)/100000};
  const A2={},S2={};AK.forEach(k=>A2[k]=r.A[k]+eps(k));SK.forEach(k=>S2[k]=r.S[k]+eps(k));
  r={A:A2,S:S2};
  const ar=rankKeys(r.A,AK), sr=rankKeys(r.S,SK);
  /* The lane leads: take the top Archetype, then its best-fitting valid Style (only invalid pairings are skipped; interest alone does not need evidence). */
  const a=ar[0];
  let s=null,bs=-1;
  SK.forEach(y=>{const v=pairV(a,y);if(v==='N')return;const sc=r.S[y];if(sc>bs+1e-9){bs=sc;s=y}});
  let b=null;ar.forEach(x=>{if(!b&&x!==a&&r.A[x]>0&&pairV(x,s)!=='N')b=x});
  let s2=null;sr.forEach(y=>{if(!s2&&y!==s&&r.S[y]>0&&pairV(a,y)!=='N')s2=y});
  return {a,s,b,s2,tag:`${AN[a]} ${SN[s]}`,ar,sr};
}

function spiderSVG(A){
  const cx=280,cy=210,R=125,n=AK.length;
  const pt=(i,r)=>{const t=i*2*Math.PI/n;return [cx+r*Math.sin(t),cy-r*Math.cos(t)]};
  const f=v=>v.toFixed(1);
  const rings=[25,50,75,100].map(v=>`<polygon class="ring" points="${AK.map((_,i)=>pt(i,R*v/100).map(f).join(',')).join(' ')}"/>`).join('');
  const rl=[25,50,75,100].map(v=>`<text class="rl" x="${cx+4}" y="${f(cy-R*v/100-3)}">${v}</text>`).join('');
  const spokes=AK.map((_,i)=>{const p=pt(i,R);return `<line class="spoke" x1="${cx}" y1="${cy}" x2="${f(p[0])}" y2="${f(p[1])}"/>`}).join('');
  const poly=AK.map((k,i)=>pt(i,R*Math.max(A[k],1.5)/100).map(f).join(',')).join(' ');
  const dots=AK.map((k,i)=>{const p=pt(i,R*Math.max(A[k],1.5)/100);return `<circle class="dot" cx="${f(p[0])}" cy="${f(p[1])}" r="4"/>`}).join('');
  const labels=AK.map((k,i)=>{
    const t=i*2*Math.PI/n,s=Math.sin(t),c=Math.cos(t);
    const x=cx+(R+16)*s,y=cy-(R+16)*c;
    const anchor=s>0.3?'start':(s<-0.3?'end':'middle');
    const dy=c>0.5?-6:(c<-0.5?10:3);
    return `<text class="lbl" x="${f(x)}" y="${f(y+dy)}" text-anchor="${anchor}">${AN[k]}<tspan class="val" x="${f(x)}" dy="14">${Math.round(A[k])}</tspan></text>`;
  }).join('');
  const label=AK.map(k=>`${AN[k]} ${Math.round(A[k])}`).join(', ');
  return `<svg class="spider" viewBox="0 0 560 420" role="img" aria-label="Depth by lane out of 100: ${label}">${rings}${spokes}${rl}<polygon class="area" points="${poly}"/>${dots}${labels}</svg>`;
}
function bars(Sc,topKey){
  return `<div class="sbars">`+rankKeys(Sc,SK).map(k=>`<div class="sb${k===topKey?' top':''}"><span>${SN[k]}</span><span class="track"><i style="width:${Math.max(Sc[k],0).toFixed(1)}%"></i></span><span class="v">${Math.round(Sc[k])}</span></div>`).join('')+`</div>`;
}
function pips(p){
  return `<span class="pips" role="img" aria-label="${LEVEL[p]}">${[1,2,3].map(n=>`<i class="${p>=n?'f':''}"></i>`).join('')}<span>${LEVEL[p]}</span></span>`;
}
function treeHTML(r,open){
  return `<div class="tree">`+rankKeys(r.A,AK).map(a=>{
    const rows=CLASSES[a].map(c=>{const li=ITEMS.map((it,i)=>[it,i]).filter(x=>x[0][0]===a&&x[0][4]===c).map(([it,i])=>`<li><span>${it[2]}</span>${pips(S.ans[i]||0)}<span class="st">${SN[it[1]]}</span></li>`).join('');return li?`<li class="cls">${c}</li>${li}`:''}).join('');
    return `<details class="lane"${open.includes(a)?' open':''}><summary><span>${AN[a]}</span><span class="sc">${Math.round(r.A[a])}</span></summary><ul>${rows}</ul></details>`;
  }).join('')+`</div>`;
}
function histHTML(){
  const cnt=[0,0,0,0];ITEMS.forEach((_,i)=>cnt[S.ans[i]||0]++);
  const n=ITEMS.length,cl=['h0','h1','h2','h3'];
  const all=LEVEL.map((l,j)=>`<div class="sb"><span>${LADDER[j][0]}</span><span class="track"><i class="${cl[j]}" style="width:${(cnt[j]/n*100).toFixed(1)}%"></i></span><span class="v">${cnt[j]}</span></div>`).join('');
  const lanes=AK.map(a=>{
    const c=[0,0,0,0];ITEMS.forEach((it,i)=>{if(it[0]===a)c[S.ans[i]||0]++});
    const segs=c.map((v,j)=>v?`<i class="${cl[j]}" style="width:${v/5*100}%" title="${LADDER[j][0]}: ${v}"></i>`:'').join('');
    return `<div class="hl"><span>${AN[a]}</span><span class="stack" role="img" aria-label="${AN[a]}: ${c.map((v,j)=>LADDER[j][0]+' '+v).join(', ')}">${segs}</span><span class="hcnt">${c[3]}·${c[2]}·${c[1]}·${c[0]}</span></div>`;
  }).join('');
  const key=LADDER.map((l,j)=>`<span class="lg"><i class="${cl[j]}"></i>${l[0]}</span>`).join('');
  return `<p class="vznote">How many of your ${n} answers sit at each level.</p><div class="sbars">${all}</div>
  <h3 class="vzh">Answers by lane</h3><div class="hist">${lanes}</div><p class="legend">${key}</p><p class="vznote">Numbers on the right: done for real · on my own · tried · never.</p>`;
}
function gridHTML(){
  const head=SK.map(k=>`<span class="gh">${SN[k]}</span>`).join('');
  const rows=AK.map(a=>{
    const cells=SK.map(y=>{
      const v=ITEMS.map((it,i)=>[it,i]).filter(([it])=>it[0]===a&&it[1]===y).map(([,i])=>S.ans[i]||0);
      if(!v.length)return `<span class="gc none" aria-label="${AN[a]} ${SN[y]}: no item">·</span>`;
      const m=Math.max(...v);
      return `<span class="gc l${m}" aria-label="${AN[a]} ${SN[y]}: highest level ${LADDER[m][0]}, ${v.length} item${v.length>1?'s':''}">${m}</span>`;
    }).join('');
    return `<span class="gr">${AN[a]}</span>${cells}`;
  }).join('');
  return `<p class="vznote">Each cell is the highest level you reported for the items in that Archetype and Style pairing. 0 never, 1 tried, 2 on my own, 3 done for real. A dot means the assessment has no item for that pairing.</p><div class="grid7">${'<span></span>'+head+rows}</div>`;
}
function nextHTML(r){
  const ranked=rankKeys(r.A,AK);
  const blocks=ranked.map((a,ri)=>{
    const todo=CLASSES[a].map(c=>{
      const open=ITEMS.filter((it,i)=>it[0]===a&&it[4]===c&&(S.ans[i]||0)<2).map(it=>it[2]);
      return open.length?`<li><b>${c}:</b> ${open.join(', ')}</li>`:'';
    }).join('');
    const state=todo?`<ul class="nx">${todo}</ul>`:`<p>Every item in this lane is done on your own or for real.</p>`;
    return `<details class="lane"${ri<3?' open':''}><summary><span>${AN[a]}</span><span class="sc">${Math.round(r.A[a])}</span></summary><p class="vznote">Practice: ${PRACTICE[a]}.</p>${state}</details>`;
  }).join('');
  return `<p class="vznote">Items still short of "on my own," grouped by OSA class. Lanes are ordered by your depth. Check that each practice site is still available.</p><div class="tree">${blocks}</div>`;
}
function vizHTML(r,open){
  const tabs=[['Shape',spiderSVG(r.A)],['Histogram',histHTML()],['Grid',gridHTML()],['Skill tree',treeHTML(r,open)],['Next steps',nextHTML(r)]];
  const inputs=tabs.map((t,i)=>`<input type="radio" name="vz" id="vz${i}"${i===0?' checked':''}>`).join('');
  const labels=tabs.map((t,i)=>`<label for="vz${i}">${t[0]}</label>`).join('');
  const panes=tabs.map((t,i)=>`<div class="vzp p${i}">${t[1]}</div>`).join('');
  return `<div class="vz">${inputs}<div class="vzt">${labels}</div>${panes}</div>`;
}
function mapHTML(a,s,b,extra){
  const nocode=(s==='op'||s==='st')?`<div class="mcard wide"><h3>No code needed on this path</h3><p>${SN[s]} work runs on understanding systems and using tools well, like a Web Operator who lives in Burp Suite. You need to understand what code and requests do, but writing programs is optional. Coding widens your options. It does not gate entry.</p></div>`:'';
  return `<div class="map">
    ${extra||''}
    <div class="mcard"><h3>1. Common core</h3><ul>${CORE.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    <div class="mcard"><h3>2. Your Style adds</h3><p><b>${SN[s]}.</b> ${SADD[s]}.</p></div>
    <div class="mcard"><h3>3. Your lane adds</h3><p><b>${AN[a]}.</b> ${AADD[a]}.${b?` Secondary lane, ${AN[b]}: ${AADD[b]}.`:''}</p></div>
    <div class="mcard"><h3>Places to practice</h3><p>${AN[a]}: ${PRACTICE[a]}.${b?` ${AN[b]}: ${PRACTICE[b]}.`:''} Check that each is still available.</p></div>
    <div class="mcard"><h3>What transfers</h3><p>Trust boundaries, injection-style flaws and privilege models carry across every lane. Switching lanes means relearning the platform, not starting over.</p></div>
    ${nocode}
  </div>`;
}
function tagCard(tag,note,key,acts){
  return `<div class="tagcard"><p class="lab">Your hacker tag</p><p class="tag" id="tagtext" tabindex="-1" data-focus>${tag}</p><p class="tagnote">${note}</p>${key?`<span class="key">× evenly split · ( ) secondary</span>`:''}<div class="acts">${acts}</div></div>`;
}
function decodeHTML(a,s,b,mode,r,h){
  h=h||{kick:'Your tag, decoded',title:'Two halves make one tag',pre:''};
  let aname=AN[a],adef=`<p class="hd">${ADEF[a]}.</p>`;
  if(b&&mode==='hybrid'){
    const p=r.A[b]>r.A[a]?b:a,q=p===a?b:a;
    aname=`${AN[p]} × ${AN[q]}`;
    adef=`<p class="hd"><b>${AN[p]}:</b> ${ADEF[p]}.</p><p class="hd"><b>${AN[q]}:</b> ${ADEF[q]}.</p>`;
  }else if(b&&mode==='second'){
    aname=`${AN[a]} (${AN[b]})`;
    adef=`<p class="hd"><b>${AN[a]}, main:</b> ${ADEF[a]}.</p><p class="hd"><b>${AN[b]}, secondary:</b> ${ADEF[b]}.</p>`;
  }
  const aList=AK.map(k=>`<li><span class="n">${AN[k]}</span><span class="d">${ADEF[k]}</span></li>`).join('');
  const sList=SK.map(k=>`<li><span class="n">${SN[k]}</span><span class="d">${SDEF[k][0]}</span><span class="code">${SDEF[k][1]}</span></li>`).join('');
  return `<div class="sec"${h.id?` id="${h.id}"`:''}><p class="kick">${h.kick}</p><h2>${h.title}</h2>${h.pre}
  <div class="halves">
    <div class="half ha"><p class="hl">Archetype</p><p class="hn">${aname}</p><p class="hq">Where you hack</p>${adef}</div>
    <div class="half hs"><p class="hl">Style</p><p class="hn">${SN[s]}</p><p class="hq">How you hack</p><p class="hd">${SDEF[s][0]}.</p><p class="hc">${SDEF[s][1]}</p></div>
  </div>
  <div class="card note"><h3>Coding is not a skill level</h3><p>Each Style lists how much coding its work involves. That describes the work, not how good someone is. An Operator who does everything in Burp Suite or another point-and-click tool can be an expert hacker.</p></div>
  <div class="card read"><h3>Reading the symbols</h3><ul>
    <li><span class="sym">×</span><span><b>Evenly split.</b> Network × Cloud means both lanes are about equally strong.</span></li>
    <li><span class="sym">( )</span><span><b>Secondary.</b> Web (IoT) means mostly Web with some IoT. Out loud: “primarily web with some IoT.”</span></li>
    <li><span class="sym">–</span><span><b>No symbol.</b> One lane clearly leads.</span></li>
  </ul><p class="fine">Hybrid means two lanes within 15% of each other; secondary means within 40%.</p></div>
  <div class="card note"><h3>Human is Social Engineering</h3><p>The tag says Human, but the specialty is social engineering, the same archetype as in the OSA. It is its own lane, and it also travels: just as TCP/IP is the heart of networking yet carries into IoT, social engineering is a specialty of its own and shows up inside every other lane.</p></div>
  <div class="card note"><h3>A quick note</h3><p>Tags are not meant to limit or define you. They are a fast way to share your specialty, like a name tag at a meetup. Skills shift over time, plenty of great hackers work across several lanes, and you can retake this whenever you grow.</p></div>
  <details class="card dd"><summary>All Archetypes and Styles</summary>
    <h3>Archetypes: where you hack</h3><ul class="dl">${aList}</ul>
    <h3>Styles: how you hack</h3><ul class="dl">${sList}</ul>
  </details>
  <div class="card src"><h3>Original posts</h3><ul class="posts"><li><a href="https://paragraph.com/@derrickjr/osa" target="_blank" rel="noopener">Offensive Security Archetypes</a></li><li><a href="https://paragraph.com/@derrickjr/technical-hacking-is-social" target="_blank" rel="noopener">Technical Hacking is Social</a></li></ul></div>
  <div class="card src"><h3>The full document</h3><p class="fine">How the scoring, pairings and both assessments work.</p><a class="btn-link" href="https://claude.ai/code/artifact/5a869950-ffad-46ac-89c7-e53db83adcc9" target="_blank" rel="noopener">Read the spec ↗</a></div></div>`;
}
function keySection(){
  return decodeHTML('web','op',null,'pure',null,{id:'key',kick:'Key',title:'How to read a tag',pre:'<div class="tagdemo">Web Operator</div>'});
}
function keyView(){
  const fromRes=S.from==='result';
  return `<div class="rtop">${WM}<button type="button" class="link" data-act="${fromRes?'backres':'home'}">← ${fromRes?'Back to results':'Home'}</button></div><div class="res">${keySection()}</div>`;
}
function rTop(){return `<div class="rtop">${WM}<div class="rt-r"><button type="button" class="link" data-act="key">Key</button><button type="button" class="link" data-act="home">Home</button></div></div>`}
function stats(list){return `<div class="stats">${list.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`}

function resultA1(){
  const r=scoreA1(S.ans),t=tagA1(r,S.ans);
  const note=`You were pulled most toward ${AN[t.a]} and the ${SN[t.s]} way of working.${t.b?` You might also like ${AN[t.b]}.`:''}${t.s2?` ${SN[t.s2]} is a good second Style to try.`:''}`;
  const acts=`<button type="button" class="btn orange" data-act="copy">Copy tag</button><button type="button" class="btn ghost" data-act="key">Key</button><button type="button" class="btn ghost" data-act="intro" data-mode="a2">Try Assessment 2</button><button type="button" class="btn ghost" data-act="intro" data-mode="a1">Retake</button>`;
  const extra=`<div class="mcard wide"><h3>Your next step</h3><p>Work through the common core while you try one lab in ${AN[t.a]}. Take Assessment 2 after some hands-on time to see your depth across all nine lanes.</p></div>`;
  return rTop()+`<div class="res">
    ${tagCard(t.tag,note,false,acts)}
    ${stats([[Math.round(r.A[t.a])+'%','pull to '+AN[t.a]],[Math.round(r.S[t.s])+'%','pull to '+SN[t.s]],[t.b?AN[t.b]:'—','also try']])}
    <div class="sec"><p class="kick">Your pull</p><h2>Interest by lane</h2>${spiderSVG(r.A)}</div>
    <div class="sec"><p class="kick">Your style</p><h2>How you like to work</h2>${bars(r.S,t.s)}</div>
    <div class="sec"><p class="kick">Level up</p><h2>Where to start</h2>${mapHTML(t.a,t.s,t.b,extra)}</div>
  </div>`;
}
function resultA2(){
  const r=scoreA2(S.ans),t=tagA2(r);
  const counts=[0,0,0,0];ITEMS.forEach((_,i)=>counts[S.ans[i]||0]++);
  const lanes=AK.filter(k=>r.A[k]>0).length;
  const evidence=`<p><b>Evidence.</b> ${counts[3]} of ${ITEMS.length} items at done-it-for-real, ${counts[2]} on-my-own, ${counts[1]} tried-it.</p>`;
  if(t.none){
    const acts=`<button type="button" class="btn" data-act="intro" data-mode="a1">Try Assessment 1</button><button type="button" class="btn ghost" data-act="intro" data-mode="a2">Retake</button>`;
    return rTop()+`<div class="res">
      ${tagCard('Not enough evidence yet',`No lane has reached 20 out of 100, so a tag would be a guess. Try more labs, or take Assessment 1 for now.`,false,acts)}
      ${stats([[lanes,'lanes explored'],[counts[3],'done for real'],[counts[1]+counts[2],'tried or solo']])}
      <div class="sec"><p class="kick">Your data</p><h2>Five ways to look at it</h2>${vizHTML(r,[])}</div>
      <div class="sec"><h2>Depth by Style</h2>${bars(r.S,null)}</div>
    </div>`;
  }
  const {a,s,b,mode}=t;
  const desc=mode==='hybrid'?`Hybrid: ${AN[a]} and ${AN[b]} are evenly matched.`:(mode==='second'?`${AN[a]}-led, with ${AN[b]} as a real secondary.`:`${AN[a]} clearly leads.`);
  const acts=`<button type="button" class="btn orange" data-act="copy">Copy tag</button><button type="button" class="btn ghost" data-act="key">Key</button><button type="button" class="btn ghost" data-act="intro" data-mode="a2">Retake</button>`;
  const d=[];
  if(b&&mode==='hybrid')d.push(`<p><b>Lanes.</b> ${AN[a]} and ${AN[b]} are within ${Math.round(t.gap*100)}% of each other, so the tag shows both.</p>`);
  else if(b&&mode==='second')d.push(`<p><b>Lanes.</b> Your ${AN[a]} depth is about ${(r.A[a]/r.A[b]).toFixed(1)}× your ${AN[b]} depth.</p>`);
  else{const nx=t.ar.find(x=>x!==a);d.push(`<p><b>Lanes.</b> ${AN[a]} scores ${Math.round(r.A[a])}. The next lane, ${AN[nx]}, scores ${Math.round(r.A[nx])}.</p>`)}
  const s2=t.sr.find(x=>x!==t.s);
  d.push(`<p><b>Style.</b> Your strongest Style is ${SN[t.s]} at ${Math.round(r.S[t.s])}${s2?`, then ${SN[s2]} at ${Math.round(r.S[s2])}`:''}.</p>`);
  if(t.fell)d.push(`<p><b>Adjusted.</b> Your top scores, ${AN[t.ar[0]]} and ${SN[t.sr[0]]}, are not a pairing the model uses, so the tag shows ${AN[a]} ${SN[s]} instead.</p>`);
  d.push(evidence);
  const untouched=ITEMS.map((it,i)=>[it,i]).filter(([it,i])=>it[0]===a&&(S.ans[i]||0)<2).map(([it])=>it[2]);
  const extra=untouched.length?`<div class="mcard wide"><h3>Next branches in ${AN[a]}</h3><p>Not yet done on your own: ${untouched.join(', ')}. Pick one and work it through without a walkthrough.</p></div>`:`<div class="mcard wide"><h3>Next branches in ${AN[a]}</h3><p>You have done every ${AN[a]} item on your own or for real. Try a second lane, or go deeper in a second Style.</p></div>`;
  return rTop()+`<div class="res">
    ${tagCard(t.tag,desc,false,acts)}
    ${stats([[lanes,'lanes explored'],[counts[3],'done for real'],[Math.round(r.A[a]),AN[a]+' depth']])}
    <div class="sec"><p class="kick">Your data</p><h2>Five ways to look at it</h2>${vizHTML(r,[a,b].filter(Boolean))}</div>
    <div class="sec"><p class="kick">Your style</p><h2>How you work</h2>${bars(r.S,t.s)}<div class="diag">${d.join('')}</div></div>
    <div class="sec"><p class="kick">Level up</p><h2>Learning map</h2>${mapHTML(a,s,b,extra)}</div>
  </div>`;
}

/* ---------- render and events ---------- */
function render(focus){
  let h='';
  if(S.view==='home')h=homeView();
  else if(S.view==='intro')h=introView();
  else if(S.view==='key')h=keyView();
  else if(S.view==='q')h=questionView();
  else h=S.mode==='a1'?resultA1():resultA2();
  app.innerHTML=h;
  document.body.classList.toggle('has-foot',S.view==='intro'||S.view==='q');
  if(focus!==false&&S.view!=='home'){const f=app.querySelector('[data-focus]');if(f)try{f.focus({preventScroll:true})}catch(e){}}
}
function go(view){S.view=view;if(view==='result')S.saved={mode:S.mode,ans:S.ans.slice()};render();try{window.scrollTo(0,0)}catch(e){}}
function total(){return S.mode==='a1'?QQ.length:ITEMS.length}
function advance(){
  if(S.i<total()-1){S.i++;render();try{window.scrollTo(0,0)}catch(e){}}else go('result');
}
function copyTag(btn){
  const el=document.getElementById('tagtext');if(!el)return;
  const text=`${el.textContent} (WhoHacker)`;
  const done=m=>{const o=btn.textContent;btn.textContent=m;setTimeout(()=>{btn.textContent=o},1800)};
  const fallback=()=>{
    try{const r=document.createRange();r.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);done('Selected: Ctrl or Cmd+C')}catch(e){done('Copy unavailable')}
  };
  try{navigator.clipboard.writeText(text).then(()=>done('Copied'),fallback)}catch(e){fallback()}
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(act==='home'){S={view:'home',mode:null,i:0,ans:[],saved:S.saved};go('home')}
  else if(act==='intro'){S={view:'intro',mode:b.dataset.mode,i:0,ans:[],saved:S.saved};go('intro')}
  else if(act==='key'){S.from=S.view==='result'?'result':'home';go('key')}
  else if(act==='backres'){go('result')}
  else if(act==='viewresults'){S.mode=S.saved.mode;S.ans=S.saved.ans.slice();go('result')}
  else if(act==='scrollkey'){const k=document.getElementById('key');if(k)try{k.scrollIntoView({behavior:'smooth'})}catch(x){k.scrollIntoView()}}
  else if(act==='begin'){S.i=0;S.ans=[];if(S.mode==='a1')QQ=freshQ();go('q')}
  else if(act==='pick'){S.ans[S.i]=Number(b.dataset.v);render(false);const c=document.getElementById('cont');if(c)try{c.focus({preventScroll:true})}catch(x){}}
  else if(act==='next'){if(S.ans[S.i]!=null)advance()}
  else if(act==='back'){if(S.i>0){S.i--;render()}}
  else if(act==='copy')copyTag(b);
});
render();
</script>
